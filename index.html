        function actualizarSubmenuServicio() {
            const selectProducto = document.getElementById('cli-producto');
            const selectSub = document.getElementById('cli-subservicio');
            if (!selectProducto || !selectSub) return;
            const opciones = opcionesServicios[selectProducto.value] || ["General"];
            selectSub.innerHTML = opciones.map(op => `<option value="${op}">${op}</option>`).join('');
        }

        async function generarSiguienteTicket() {
            let maxNum = 0;
            clientesGlobal.forEach(c => {
                if (c.nro_ticket) {
                    const num = parseInt(c.nro_ticket, 10);
                    if (!isNaN(num) && num > maxNum) {
                        maxNum = num;
                    }
                }
            });
            const siguiente = maxNum + 1;
            return String(siguiente).padStart(8, '0');
        }

        async function toggleEscalamiento() {
            const isChecked = document.getElementById('cli-escalar').checked;
            const container = document.getElementById('contenedor-ticket');
            const inputTicket = document.getElementById('cli-ticket');
            if (isChecked) {
                container.classList.remove('hidden');
                const nuevoTicket = await generarSiguienteTicket();
                inputTicket.value = nuevoTicket;
            } else {
                container.classList.add('hidden');
                inputTicket.value = '';
            }
        }

        function formatearNombreOperador(correo) {
            if (!correo) return 'Sin Asignar';
            const partes = correo.split('@')[0].split('.');
            return partes.map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
        }

        function poblarCheckboxesOperadoresCampania() {
            const container = document.getElementById('contenedor-checkboxes-operadores');
            if (!container) return;

            const operadores = usuariosGlobal.filter(u => (u.rol || '').toUpperCase() === 'OPERADOR');
            if (operadores.length === 0) {
                container.innerHTML = `<p class="text-zinc-500 text-xs p-2 text-center">No hay operadores registrados.</p>`;
                return;
            }

            container.innerHTML = operadores.map(op => {
                const correo = op.correo || op.email;
                const nombreFormateado = formatearNombreOperador(correo);
                return `
                    <label class="flex items-center space-x-2 text-xs text-zinc-300 hover:text-white cursor-pointer select-none p-1 bg-zinc-950/40 rounded-lg hover:bg-zinc-950 transition">
                        <input type="checkbox" name="op-campania-chk" value="${correo}" class="w-4 h-4 rounded text-red-600 focus:ring-red-500 bg-zinc-950 border-zinc-700">
                        <span class="font-medium">${nombreFormateado}</span>
                        <span class="text-[10px] text-zinc-500 ml-auto">(${correo})</span>
                    </label>
                `;
            }).join('');
        }

        function marcarTodosOperadores(marcar = true) {
            const checkboxes = document.querySelectorAll('input[name="op-campania-chk"]');
            checkboxes.forEach(chk => chk.checked = marcar);
        }

        document.addEventListener('DOMContentLoaded', () => {
            actualizarSubmenuServicio();

            const passwordInput = document.getElementById('login-password');
            const togglePasswordBtn = document.getElementById('toggle-password');
            const toggleIcon = document.getElementById('toggle-icon');

            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        toggleIcon.className = "fa-solid fa-eye-slash";
                    } else {
                        passwordInput.type = 'password';
                        toggleIcon.className = "fa-solid fa-eye";
                    }
                });
            }

            const usrPasswordInput = document.getElementById('usr-password');
            const toggleUsrBtn = document.getElementById('toggle-usr-password');
            const toggleUsrIcon = document.getElementById('toggle-usr-icon');

            if (toggleUsrBtn && usrPasswordInput) {
                toggleUsrBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (usrPasswordInput.type === 'password') {
                        usrPasswordInput.type = 'text';
                        toggleUsrIcon.className = "fa-solid fa-eye-slash";
                    } else {
                        usrPasswordInput.type = 'password';
                        toggleUsrIcon.className = "fa-solid fa-eye";
                    }
                });
            }
        });
    </script>

        async function guardarGestionCampania(id) {
            const estatus = document.getElementById(`camp-estatus-${id}`).value;
            const fechaHoy = new Date().toISOString().split('T')[0];

            const campItem = campanasGlobal.find(c => c.id === id);

        async function procesarImportacionCampania() {
            const nombreCampana = document.getElementById('campana-nombre').value.trim();
            const fileInput = document.getElementById('campana-file');
            
            const checkboxes = document.querySelectorAll('input[name="op-campania-chk"]:checked');
            const operadoresSeleccionados = Array.from(checkboxes).map(chk => chk.value);

            if (!nombreCampana) {
                alert('Por favor ingresa un nombre para la campaña.');
                return;
            }
            if (operadoresSeleccionados.length === 0) {
                alert('Por favor selecciona al menos un operador destino para la campaña.');
                return;
            }
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Por favor selecciona un archivo Excel (.xlsx o .csv).');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    const rows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    if (!rows || rows.length === 0) {
                        alert('El archivo Excel está vacío o no tiene registros válidos.');
                        return;
                    }

                    const rawHeaderRow = Object.keys(rows[0]);

                    let registrosImportados = 0;
                    const totalOperadores = operadoresSeleccionados.length;

                    for (let index = 0; index < rows.length; index++) {
                        const row = rows[index];
                        const operadorAsignado = operadoresSeleccionados[index % totalOperadores];
                        const nombreOperadorLimpio = formatearNombreOperador(operadorAsignado);

                        const rowLimpia = {
                            nombre_campana: nombreCampana,
                            operador_asignado: operadorAsignado,
                            gestor: nombreOperadorLimpio,
                            estatus: 'PENDIENTE',
                            fecha_gestion: '-',
                            columnas_excel: rawHeaderRow,
                            datos: row,
                            created_at: new Date().toISOString()
                        };

                        const { error: insertErr } = await _supabase.from('campanas_crm').insert([rowLimpia]);
                        if (insertErr) {
                            console.error("Error insertando registro:", insertErr.message);
                        } else {
                            registrosImportados++;
                        }
                    }

                    alert(`¡Campaña importada con éxito! Se distribuyeron ${registrosImportados} registros equitativamente entre ${totalOperadores} operadores.`);
                    document.getElementById('campana-nombre').value = '';
                    fileInput.value = '';
                    marcarTodosOperadores(false);
                    cargarCampanas();
                    registrarAuditoria(currentUser.email, 'ACCION', `Importó campaña "${nombreCampana}" con ${registrosImportados} registros`);

                } catch (err) {
                    console.error("Error al procesar el archivo Excel:", err);
                    alert("Error al procesar el archivo Excel.");
                }
            };

            reader.readAsArrayBuffer(file);
        }

        function aplicarFiltroFechas() {
            const desde = document.getElementById('filtro-fecha-desde').value;
            const hasta = document.getElementById('filtro-fecha-hasta').value;

            if (desde) {
                const d = new Date(desde);
                clientesFiltrados = clientesFiltrados.filter(c => new Date(c.created_at || c.fecha) >= d);
            }
            if (hasta) {
                const h = new Date(hasta);
                h.setHours(23, 59, 59);
                clientesFiltrados = clientesFiltrados.filter(c => new Date(c.created_at || c.fecha) <= h);

        function actualizarDashboardConFiltro(clientes, auditoria, usuarios) {
            const elTotalReg = document.getElementById('stat-total-registros');
            const elTotalEsc = document.getElementById('stat-total-escalados');
            const elEnProc = document.getElementById('stat-en-proceso');
            const elProc = document.getElementById('stat-procesados');

            if (elTotalReg) elTotalReg.textContent = clientes.length;

            const totalEscalados = clientes.filter(c => c.escalado === true || c.escalado === 'true').length;
            const enProceso = clientes.filter(c => (c.escalado === true || c.escalado === 'true') && (c.estatus_operaciones === 'EN PROCESO' || c.estatus_operaciones === 'PENDIENTE')).length;
            const procesados = clientes.filter(c => (c.escalado === true || c.escalado === 'true') && c.estatus_operaciones === 'PROCESADO').length;

            if (elTotalEsc) elTotalEsc.textContent = totalEscalados;
            if (elEnProc) elEnProc.textContent = enProceso;
            if (elProc) elProc.textContent = procesados;

            const conteoOperadores = {};
            clientes.forEach(c => {
                const op = c.operador || 'Sistema / Sin asignar';
                conteoOperadores[op] = (conteoOperadores[op] || 0) + 1;
            });

            const rankingOrdenado = Object.entries(conteoOperadores).sort((a, b) => b[1] - a[1]);
            const contenedorRanking = document.getElementById('contenedor-ranking-operadores');

            if (contenedorRanking) {
                if (rankingOrdenado.length === 0) {
                    contenedorRanking.innerHTML = `<p class="text-zinc-500 text-xs text-center py-4">Sin registros en este periodo.</p>`;
                } else {
                    const maxRegistros = rankingOrdenado[0][1];
                    contenedorRanking.innerHTML = rankingOrdenado.map(([op, total], idx) => {
                        const porcentaje = Math.round((total / maxRegistros) * 100);
                        const esPrimero = idx === 0 ? 'border-amber-500/30 bg-amber-500/5' : 'border-zinc-800 bg-zinc-900/40';
                        const medalla = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
                        
                        return `
                            <div class="p-2.5 rounded-xl border ${esPrimero} space-y-1.5">
                                <div class="flex items-center justify-between text-xs">
                                    <div class="flex items-center space-x-2 truncate">

                                        <span class="font-semibold text-zinc-200 truncate" title="${op}">${op.split('@')[0]}</span>
                                    </div>
                                    <span class="font-bold text-red-500 ml-2">${total}</span>
                                </div>
                                <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                                    <div class="h-full bg-red-600 rounded-full transition-all duration-500" style="width: ${porcentaje}%"></div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            }

            const conteoMotivos = {};
            clientes.forEach(c => {
                const m = c.motivo || 'Sin Motivo';
                conteoMotivos[m] = (conteoMotivos[m] || 0) + 1;
            });

            const conteoCanales = {};
            clientes.forEach(c => {
                const ch = c.canal || 'Llamada';
                conteoCanales[ch] = (conteoCanales[ch] || 0) + 1;
            });

            renderizarGraficos(
                Object.keys(conteoMotivos), Object.values(conteoMotivos),

        }

                return;
            }

            await _supabase.from('usuarios_crm').insert([{ correo: correo, rol: rol }]);
            await registrarAuditoria(opEmail, 'ACCION', `Agregó un nuevo usuario al CRM: ${correo} (Rol: ${rol})`);

            cerrarModalUsuario();
            document.getElementById('form-usuario').reset();
            cargarDatosGenerales();
        });

        async function eliminarUsuario(id, correoUsuario) {
            if (confirm('¿Deseas eliminar este usuario de la administración?')) {
                const opEmail = currentUser ? currentUser.email : 'Administrador';
                await _supabase.from('usuarios_crm').delete().eq('id', id);
                await registrarAuditoria(opEmail, 'ACCION', `Eliminó al usuario del CRM: ${correoUsuario || id}`);
                cargarUsuarios();
            }
        }

        function renderAuditoriaTab() {
            const tbody = document.getElementById('tbody-auditoria');
            if (!tbody) return;

            if (!auditoriaGlobal || auditoriaGlobal.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-zinc-500">Sin registros de auditoría recientes.</td></tr>`;
                return;
            }
            tbody.innerHTML = auditoriaGlobal.map(log => {
                const fechaLog = new Date(log.fecha || log.created_at || Date.now()).toLocaleString();
                const usuarioLog = log.correo || log.email || 'Desconocido';
                const resultadoLog = (log.resultado || log.status || 'ACCION').toUpperCase();
                const detalleLog = log.detalle || log.description || log.reason || '-';
                
                let colorRes = 'bg-zinc-800 text-zinc-300 border border-zinc-700';
                if (resultadoLog === 'EXITOSO') colorRes = 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                if (resultadoLog === 'FALLIDO' || resultadoLog === 'BLOQUEADO') colorRes = 'bg-red-500/10 text-red-400 border border-red-500/20';
                if (resultadoLog === 'ACCION') colorRes = 'bg-zinc-800 text-zinc-300 border border-zinc-700';

                return `
                    <tr class="hover:bg-zinc-900/50 transition">
                        <td class="p-4 font-mono text-zinc-400">${fechaLog}</td>
                        <td class="p-4 font-semibold text-white">${usuarioLog}</td>
                        <td class="p-4"><span class="px-2 py-1 rounded text-[10px] font-bold ${colorRes}">${resultadoLog}</span></td>
                        <td class="p-4 text-zinc-300">${detalleLog}</td>
                    </tr>`;
            }).join('');
        }

        function renderBloqueados() {
            const tbody = document.getElementById('tbody-bloqueados');
            if (!tbody) return;

            if (!bloqueadosGlobal || bloqueadosGlobal.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-zinc-500">No hay usuarios bloqueados en lista negra.</td></tr>`;
                return;
            }
            tbody.innerHTML = bloqueadosGlobal.map(b => {
                const correoB = b.correo || b.email || 'Desconocido';
                const motivoB = b.motivo || b.reason || 'Bloqueado por seguridad';
                const fechaB = new Date(b.fecha || b.created_at || Date.now()).toLocaleString();

                return `
                    <tr class="hover:bg-zinc-900/50 transition">
                        <td class="p-3 font-semibold text-white">${correoB}</td>
                        <td class="p-3 text-red-400">${motivoB}</td>
                        <td class="p-3 font-mono text-zinc-400">${fechaB}</td>
                        <td class="p-3 text-center">
                            <button onclick="desbloquearUsuario('${b.id}', '${correoB}')" class="px-3 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 rounded-lg text-xs font-semibold transition">Desbloquear</button>
                        </td>
                    </tr>`;
            }).join('');
        }

        async function desbloquearUsuario(id, correo) {
            if (confirm(`¿Estás seguro de desbloquear al usuario ${correo}?`)) {
                await _supabase.from('usuarios_bloqueados').delete().eq('id', id);
                
                const adminEmail = currentUser ? currentUser.email : 'Administrador';
                await registrarAuditoria(adminEmail, 'EXITOSO', `Desbloqueó al usuario: ${correo}`);

                cargarDatosGenerales();
            }
        }

        function abrirDetalleDashboard(tipo) {
            const modal = document.getElementById('modal-filtro-dashboard');
            const titulo = document.getElementById('modal-filtro-titulo');
            const tbody = document.getElementById('tbody-modal-filtro');
            if (!modal || !tbody) return;

            let filtrados = [];
            let nombreTitulo = '';

            try {
                if (tipo === 'escalados') {
                    filtrados = clientesGlobal.filter(c => c && (c.escalado === true || c.escalado === 'true'));
                    nombreTitulo = 'Casos Escalados Total';
                } else if (tipo === 'en_proceso') {
                    filtrados = clientesGlobal.filter(c => c && (c.escalado === true || c.escalado === 'true') && (c.estatus_operaciones === 'EN PROCESO' || c.estatus_operaciones === 'PENDIENTE'));
                    nombreTitulo = 'Casos En Proceso / Pendientes';
                } else if (tipo === 'procesados') {
                    filtrados = clientesGlobal.filter(c => c && (c.escalado === true || c.escalado === 'true') && c.estatus_operaciones === 'PROCESADO');
                    nombreTitulo = 'Casos Procesados / Cierre';
                }

                titulo.textContent = `${nombreTitulo} (${filtrados.length} registros)`;

                if (filtrados.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-zinc-500">No hay registros para esta categoría.</td></tr>`;
                } else {
                    tbody.innerHTML = filtrados.map(c => {
                        const estatusOp = c.estatus_operaciones || 'EN PROCESO';
                        const fechaStr = c.created_at || c.fecha ? new Date(c.created_at || c.fecha).toLocaleDateString() : 'S/F';
                        return `
                            <tr class="hover:bg-zinc-900/50 transition">
                                <td class="p-3 font-mono text-zinc-400">
                                    <span class="text-amber-400 font-bold block">Ticket: ${c.nro_ticket || 'S/N'}</span>
                                    <span class="text-[10px] text-zinc-500">${fechaStr}</span>
                                </td>
                                <td class="p-3 font-semibold text-white">
                                    ${c.nombre || 'Sin Nombre'}
                                    <span class="block text-[11px] font-mono text-zinc-400">CI: ${c.cedula || 'N/A'}</span>
                                </td>
                                <td class="p-3 text-zinc-300">
                                    <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/10 text-red-400 border border-red-500/20">${c.motivo || 'Consulta'}</span>
                                    <div class="mt-1 text-zinc-400 text-[11px]">${c.producto || ''} - ${c.subservicio || ''}</div>
                                </td>
                                <td class="p-3 text-zinc-300 max-w-xs">
                                    <div class="bg-zinc-950 p-2 rounded border border-zinc-800 text-xs">${c.observaciones || '-'}</div>
                                    ${c.respuesta_operaciones ? `<div class="mt-1 text-[10px] text-emerald-400"><strong>Resp:</strong> ${c.respuesta_operaciones}</div>` : ''}
                                </td>
                                <td class="p-3 font-bold text-white">
                                    <span class="px-2 py-1 rounded text-[10px] bg-zinc-800 text-zinc-300">${estatusOp}</span>
                                </td>
                            </tr>`;
                    }).join('');
                }

                modal.classList.remove('hidden');
            } catch (err) {
                console.error("Error al renderizar el detalle del dashboard:", err);
                alert("Ocurrió un error al cargar los detalles.");
            }
        }

        function cerrarModalFiltroDashboard() {
            const modal = document.getElementById('modal-filtro-dashboard');
            if (modal) modal.classList.add('hidden');
        }

        function switchTab(t) {
            const esOperaciones = currentUser && currentUser.email.toLowerCase() === 'operaciones.atu@bancrecer.com.ve';
            
            if (esOperaciones) t = 'operaciones-bandeja';

            ['dashboard', 'clientes', 'usuarios', 'auditoria', 'campañas', 'operaciones-bandeja'].forEach(tab => {
                const sec = document.getElementById(`tab-${tab}`);
                const nav = document.getElementById(`nav-${tab}`);
                if (sec) sec.classList.add('hidden');
                if (nav) nav.className = "w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-medium text-zinc-400 hover:bg-zinc-900 hover:text-white transition";
            });

            const activeSec = document.getElementById(`tab-${t}`);
            const activeNav = document.getElementById(`nav-${t}`);
            if (activeSec) activeSec.classList.remove('hidden');
            if (activeNav) activeNav.className = "w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-medium transition text-red-500 bg-red-600/10 border border-red-500/20";

            if (t === 'dashboard') cargarDatosGenerales();
            if (t === 'clientes') cargarClientes();
            if (t === 'usuarios') cargarUsuarios();
            if (t === 'auditoria') refrescarAuditoria(false);
            if (t === 'campañas') cargarCampanas();
            if (t === 'operaciones-bandeja') cargarDatosGenerales();
        }

        function abrirModalCliente() { 
            const m = document.getElementById('modal-cliente');
            if (m) m.classList.remove('hidden'); 
            actualizarSubmenuServicio();
        }
        function cerrarModalCliente() { 
            const m = document.getElementById('modal-cliente');
            if (m) m.classList.add('hidden'); 
        }
        function abrirModalUsuario() { 
            const m = document.getElementById('modal-usuario');
            if (m) m.classList.remove('hidden'); 
        }
        function cerrarModalUsuario() { 
            const m = document.getElementById('modal-usuario');
            if (m) m.classList.add('hidden'); 
        }

        function exportToExcel(id, name) {
            XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById(id)), `${name}.xlsx`);
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
